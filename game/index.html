<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Porto Verde — An Open-World Crime Story</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0e1626; font-family: Arial, Helvetica, sans-serif; }
  #game-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; color: #fff; }
  #hud { position: absolute; inset: 0; }
  #top-right { position: absolute; top: 14px; right: 18px; text-align: right; text-shadow: 0 2px 4px #000; }
  #clock { font-size: 26px; font-weight: bold; letter-spacing: 1px; }
  #phase { font-size: 14px; color: #ffd76a; }
  #cash { font-size: 22px; font-weight: bold; color: #7dff9a; }
  #stars { font-size: 24px; letter-spacing: 3px; }
  #radio-strip { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); background: rgba(10,14,22,0.65); border: 1px solid rgba(255,215,106,0.6); border-radius: 20px; padding: 6px 16px; font-size: 15px; }
  #mission-box { position: absolute; top: 64px; left: 18px; background: rgba(10,14,22,0.68); border-left: 4px solid #ffd76a; border-radius: 6px; padding: 10px 14px; max-width: 340px; }
  #mission-title { font-weight: bold; font-size: 16px; color: #ffd76a; letter-spacing: 1px; }
  #mission-text { font-size: 15px; margin-top: 3px; }
  #mission-dist { font-size: 14px; color: #9fd8ff; margin-top: 3px; }
  #vehicle-plate { position: absolute; top: 150px; left: 50%; transform: translateX(-50%); font-size: 30px; font-weight: bold; letter-spacing: 3px; text-shadow: 0 3px 8px #000; color: #ffd76a; }
  #district-splash { position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%); font-size: 64px; font-weight: bold; letter-spacing: 8px; color: #fff; text-shadow: 0 4px 18px #000; opacity: 0; transition: opacity 0.5s; white-space: nowrap; }
  #flash { position: absolute; bottom: 250px; left: 50%; transform: translateX(-50%); background: rgba(10,14,22,0.8); border: 1px solid #ffd76a; border-radius: 8px; padding: 10px 20px; font-size: 17px; font-weight: bold; opacity: 0; transition: opacity 0.3s; white-space: nowrap; }
  #bottom-left { position: absolute; left: 18px; bottom: 18px; }
  #health-bar { width: 220px; height: 14px; background: rgba(0,0,0,0.6); border: 1px solid #fff; border-radius: 7px; overflow: hidden; }
  #health-fill { height: 100%; width: 100%; background: #e74c3c; }
  #ammo { margin-top: 6px; font-size: 18px; font-weight: bold; text-shadow: 0 2px 4px #000; }
  #minimap { position: absolute; right: 18px; bottom: 18px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.85); background: #14181f; }
  #title-screen, #pause-menu { position: absolute; inset: 0; background: rgba(8,12,20,0.55); display: flex; align-items: center; justify-content: center; pointer-events: auto; }
  .title-inner { text-align: center; max-width: 640px; padding: 30px; }
  .title-inner h1 { font-size: 76px; margin: 0; letter-spacing: 6px; color: #ffd76a; text-shadow: 0 6px 24px #000; }
  .subtitle { font-size: 22px; letter-spacing: 6px; margin: 4px 0 18px; }
  .blurb { font-size: 17px; line-height: 1.5; color: #e8e8e8; }
  .title-inner button { pointer-events: auto; display: block; margin: 14px auto; padding: 14px 44px; font-size: 20px; font-weight: bold; letter-spacing: 2px; background: #ffd76a; color: #111; border: none; border-radius: 8px; cursor: pointer; }
  .title-inner button:hover { background: #ffe08a; }
  .controls { font-size: 14px; color: #cfd8e3; margin-top: 20px; line-height: 1.6; }
  #big-map { position: absolute; inset: 0; background: rgba(8,12,20,0.96); pointer-events: auto; display: flex; align-items: center; justify-content: center; }
  .map-col { display: flex; flex-direction: column; align-items: center; }
  .map-col h2 { color: #ffd76a; letter-spacing: 2px; margin: 0 0 12px; }
  .map-row-wrap { display: flex; gap: 24px; align-items: flex-start; }
  #map-canvas { border: 2px solid #ffd76a; border-radius: 8px; background: #14181f; }
  #map-side { width: 300px; }
  #map-side h3 { color: #ffd76a; margin: 12px 0 6px; }
  .map-row { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.15); font-size: 15px; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game-canvas"></canvas>
<div id="ui"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
